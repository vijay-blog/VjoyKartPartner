spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB
  application:
    name: nexamart-partner-backend

  datasource:
    url: jdbc:mysql://mysql.railway.internal:3306/railway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

nexamart:
  build-commit: ${RAILWAY_GIT_COMMIT_SHA:unknown}
  jwt-secret: ${JWT_SECRET}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:60}
  refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:Admin@123}
  admin-email: ${ADMIN_EMAIL:admin@nexamart.local}
  admin-name: ${ADMIN_NAME:Admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info