spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB
  application:
    name: nexamart-partner-backend

  datasource:
    url: jdbc:mysql://mysql.railway.internal:3306/railway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    ignore-migration-patterns:
      - "*:missing"
      - "*:future"

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

nexamart:
  build-commit: ${RAILWAY_GIT_COMMIT_SHA:unknown}
  jwt-secret: ${JWT_SECRET}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:60}
  refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:Admin@123}
  admin-email: ${ADMIN_EMAIL:admin@nexamart.local}
  admin-name: ${ADMIN_NAME:Vijay}
  otp-api-key: ${TWOFACTOR_API_KEY:}
  otp-template-name: ${TWOFACTOR_OTP_TEMPLATE:}
  otp-base-url: ${TWOFACTOR_BASE_URL:https://2factor.in}
  otp-timeout-seconds: ${TWOFACTOR_TIMEOUT_SECONDS:15}
  otp-ttl-seconds: ${OTP_TTL_SECONDS:300}
  otp-resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:30}
  otp-max-verify-attempts: ${OTP_MAX_VERIFY_ATTEMPTS:5}
  otp-max-sends-per-hour: ${OTP_MAX_SENDS_PER_HOUR:5}
  otp-dev-mode: ${OTP_DEV_MODE:false}

twofactor:
  api-key: ${TWOFACTOR_API_KEY:}
  base-url: ${TWOFACTOR_BASE_URL:https://2factor.in}
  voice-base-url: ${TWOFACTOR_VOICE_BASE_URL:${TWOFACTOR_BASE_URL:https://2factor.in}}
  timeout-seconds: ${TWOFACTOR_TIMEOUT_SECONDS:10}
  sender-id: ${TWOFACTOR_SENDER_ID:}
  # Retained for compatibility and startup diagnostics.
  # For current OTP SMS endpoint, sender/template are account-side mapping.
  otp-template: ${TWOFACTOR_OTP_TEMPLATE:}


management:
  endpoints:
    web:
      exposure:
        include: health,info